<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chat: AI SDK, OpenRouter API, HTML, CSS, JS, Vite</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="app">
    <main id="chat-container">
      <div id="messages-container"></div>
      <!-- <div id="counters">
        <span id="total-messages-counter">0 total messages</span>
        <span class="separator">•</span>
        <span id="context-messages-counter">0 context messages</span>
      </div> -->
      <div id="counters">
        <span id="total-tokens-counter">0 total tokens</span>
        <span class="separator">•</span>
        <span id="context-tokens-counter">0 context tokens</span>
      </div>
    </main>

    <footer>
      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="send-button" aria-label="Send message">↑</button>
      </form>

      <div class="selector-container">
        <select id="persona-selector"></select>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
